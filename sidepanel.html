<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Agent</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<!-- Text comes from i18n.js: data-i18n sets textContent; -placeholder, -title and -aria-label set those attributes. -->
<body data-usage="">
  <header>
    <button id="modeSwitch" type="button" class="mode-pill" data-i18n-title="header.mode">
      <span id="modeDot" class="dot"></span>
      <span id="modeLabel">Browser Agent</span>
      <span aria-hidden="true">▾</span>
    </button>
    <span id="usage" class="muted" data-for="chat"></span>
    <span class="spacer"></span>
    <button id="newChat" class="ghost" data-for="chat" data-i18n="header.new" data-i18n-title="header.newTitle"></button>
    <button id="toggleSettings" class="ghost icon" data-i18n-title="header.settings" data-i18n-aria-label="header.settings">⚙</button>
  </header>

  <section id="welcome" hidden>
    <div class="lang-switch" role="group" data-i18n-aria-label="welcome.language">
      <button type="button" class="ghost small" data-lang="en">English</button>
      <button type="button" class="ghost small" data-lang="vi">Tiếng Việt</button>
    </div>
    <h1 data-i18n="welcome.title"></h1>
    <p class="muted" data-i18n="welcome.sub"></p>
    <button type="button" class="choice" data-usage="chat">
      <span class="choice-title" data-i18n="welcome.chat.title"></span>
      <span class="choice-text" data-i18n="welcome.chat.text"></span>
      <span class="choice-need" data-i18n="welcome.chat.need"></span>
    </button>
    <button type="button" class="choice" data-usage="code">
      <span class="choice-title" data-i18n="welcome.code.title"></span>
      <span class="choice-text" data-i18n="welcome.code.text"></span>
      <span class="choice-need" data-i18n="welcome.code.need"></span>
    </button>
    <button id="cancelWelcome" type="button" class="ghost" data-i18n="welcome.keep" hidden></button>
  </section>

  <form id="settings" hidden>
    <section class="group" data-for="chat">
      <h2 data-i18n="set.chat.h"></h2>
      <label><span data-i18n="set.apiKey"></span>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
        <span class="note" data-i18n="set.apiKey.note"></span>
      </label>
      <div class="field">
        <span data-i18n="set.model"></span>
        <div class="row">
          <select id="modelSelect" hidden></select>
          <input id="model" list="models" spellcheck="false">
          <button id="refreshModels" type="button" class="ghost" data-i18n="set.check" data-i18n-title="set.check.title"></button>
        </div>
        <datalist id="models">
          <option value="claude-sonnet-5-5"></option>
          <option value="claude-opus-5-5"></option>
          <option value="claude-haiku-5-5"></option>
          <option value="claude-fable-5-1"></option>
        </datalist>
        <span id="modelStatus" class="note"></span>
      </div>
      <label class="check"><input id="useGateway" type="checkbox"> <span data-i18n="set.gateway"></span></label>
      <div id="gatewayFields" class="sub" hidden>
        <label><span data-i18n="set.baseUrl"></span>
          <input id="baseUrl" type="url" spellcheck="false" data-i18n-placeholder="set.baseUrl.ph">
        </label>
        <label><span data-i18n="set.auth"></span>
          <select id="authType">
            <option value="x-api-key" data-i18n="set.auth.key"></option>
            <option value="bearer">Authorization: Bearer</option>
          </select>
        </label>
      </div>
    </section>

    <section class="group" data-for="code">
      <h2 data-i18n="set.code.h"></h2>
      <p class="note" data-i18n="set.code.note"></p>
      <div class="field">
        <span data-i18n="set.confirmIn"></span>
        <div class="segmented" role="radiogroup" data-i18n-aria-label="set.confirmIn">
          <label><input type="radio" name="confirmIn" value="terminal"><span data-i18n="set.confirmIn.terminal"></span></label>
          <label><input type="radio" name="confirmIn" value="panel"><span data-i18n="set.confirmIn.panel"></span></label>
        </div>
        <span class="note" data-i18n="set.confirmIn.note"></span>
      </div>
      <details id="bridgeAdvanced">
        <summary data-i18n="set.advanced"></summary>
        <label><span data-i18n="set.port"></span>
          <input id="bridgePort" type="number" min="1024" max="65526" placeholder="18765">
          <span class="note" data-i18n="set.port.note"></span>
        </label>
        <label><span data-i18n="set.token"></span>
          <input id="bridgeToken" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="set.token.ph">
          <span class="note" data-i18n="set.token.note"></span>
        </label>
      </details>
    </section>

    <section class="group">
      <h2 data-i18n="set.perm.h"></h2>
      <div class="field">
        <span data-i18n="set.mode"></span>
        <div class="segmented" role="radiogroup" data-i18n-aria-label="set.mode">
          <label><input type="radio" name="mode" value="ask"><span data-i18n="set.mode.ask"></span></label>
          <label><input type="radio" name="mode" value="auto"><span data-i18n="set.mode.auto"></span></label>
        </div>
        <span class="note" data-i18n="set.mode.note"></span>
      </div>
      <label><span data-i18n="set.hosts"></span>
        <textarea id="hosts" rows="3" spellcheck="false" data-i18n-placeholder="set.hosts.ph"></textarea>
      </label>
      <details id="toolsBox">
        <summary><span data-i18n="set.tools"></span> <span id="toolsCount" class="muted"></span></summary>
        <label class="check"><input type="checkbox" data-tool="read_console"> <span data-i18n="tool.read_console"></span></label>
        <label class="check"><input type="checkbox" data-tool="read_network"> <span data-i18n="tool.read_network"></span></label>
        <label class="check"><input type="checkbox" data-tool="file_upload"> <span data-i18n="tool.file_upload"></span></label>
        <label class="check"><input type="checkbox" data-tool="javascript_exec"> <span data-i18n="tool.javascript_exec"></span></label>
        <span class="note warn" data-i18n="set.tools.jsWarn"></span>
      </details>
    </section>

    <section class="group">
      <h2 data-i18n="set.lang.h"></h2>
      <select id="language" aria-label="Language / Ngôn ngữ">
        <option value="" data-i18n="set.lang.auto"></option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </section>

    <div class="actions">
      <button type="submit" data-i18n="set.save"></button>
      <button id="closeSettings" type="button" class="ghost" data-i18n="set.close"></button>
    </div>
  </form>

  <section id="sessions" data-for="code">
    <div id="sessionList"></div>
    <div id="setupGuide">
      <strong data-i18n="guide.title"></strong>
      <ol>
        <li><span data-i18n="guide.install"></span>
          <div class="copy"><code>/plugin marketplace add nqh98/browser-agent-extension</code><button type="button" class="ghost" data-copy data-i18n="guide.copy"></button></div>
          <div class="copy"><code>/plugin install browser-agent@browser-agent-extension</code><button type="button" class="ghost" data-copy data-i18n="guide.copy"></button></div>
        </li>
        <li data-i18n="guide.restart"></li>
        <li data-i18n="guide.ask"></li>
      </ol>
    </div>
    <span id="bridgeStatus" class="note"></span>
    <button id="attachCode" type="button" class="ghost small" data-i18n="code.attach" data-i18n-title="code.attach.title" hidden></button>
  </section>

  <main id="log" aria-live="polite"></main>

  <div id="attachments" hidden></div>
  <form id="composer" data-for="chat">
    <button id="attach" type="button" class="ghost" data-i18n-title="chat.attach.title" hidden>📎</button>
    <input id="files" type="file" multiple hidden>
    <textarea id="prompt" rows="2" data-i18n-placeholder="chat.placeholder"></textarea>
    <button id="send" type="submit" data-i18n="chat.send"></button>
    <button id="stop" type="button" class="danger" data-i18n="chat.stop" hidden></button>
  </form>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
